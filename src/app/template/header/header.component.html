<header class="header-main">
  <div class="header-top">
    <div class="brand" (click)="home()">
      <img class="logo-img" src="/assets/IMAGENES/Logo.png" alt="Perritos Callejeros" />
      <h1 class="brand-title">
        <span class="text-orange">PERRITOS</span>
        <span class="text-white">CALLEJEROS</span>
      </h1>
    </div>

    <div class="user-actions">
      <button *ngIf="!usuario" class="btn-user login" (click)="irlogin()">
        <i class="bi bi-person-circle"></i>
        <span>Acceder</span>
      </button>

      <div class="user-dropdown" *ngIf="usuario">
        <button class="btn-user profile-btn">
          <i class="bi bi-person-check-fill"></i>
          <div class="user-info-text">
            <span class="user-name">{{ usuario }}</span>
            <span class="user-role">{{ roleName }}</span>
          </div>
          <i class="bi bi-chevron-down small"></i>
        </button>
        
        <div class="dropdown-content">
          <div class="dropdown-header">Mi Cuenta</div>
          <a *ngIf="isAdmin" (click)="irAdmin()"><i class="bi bi-speedometer2"></i> Panel Admin</a>
          <a (click)="ircart()"><i class="bi bi-cart3"></i> Mi Carrito</a>
          <div class="dropdown-divider"></div>
          <a (click)="logout()" class="logout-item"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </div>
      </div>

      <button class="btn-user cart" (click)="ircart()">
        <div class="cart-icon-wrapper">
          <i class="bi bi-cart3"></i>
          <span class="cart-badge">{{ cartCount }}</span>
        </div>
      </button>
    </div>
  </div>

  <nav class="nav-bar">
    <ul class="nav-menu">
      <li><a (click)="home()" class="nav-link active">INICIO</a></li>
      <li><a (click)="articulo()" class="nav-link">PRODUCTOS</a></li>
      <li><a (click)="reservacion()" class="nav-link">RESERVAS</a></li>
      <li *ngIf="isAdmin"><a (click)="irAdmin()" class="nav-link admin-link">ADMIN</a></li>
      <li class="search-item">
        <div class="search-box">
          <input type="text" placeholder="¿Qué se te antoja hoy?" />
          <i class="bi bi-search"></i>
        </div>
      </li>
    </ul>
  </nav>
</header>
